<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            background-color: antiquewhite;
            padding: 50px;
            display: grid;
            grid-template-columns: 20% 20% 30%;
            /* column-gap: 20px;
            row-gap: 30px; */
            gap:30px;
            justify-content: center;
        }
        .col{
            padding: 50px;
            border:1px solid black;
            background-color: rgb(195, 134, 42);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="col" id="col-1">col-1</div>
        <div class="col" id="col-2">col-2</div>
        <div class="col" id="col-3">col-3</div>
        <div class="col" id="col-4">col-4</div>
        <div class="col" id="col-5">col-5</div>
        <div class="col" id="col-6">col-6</div>
        <div class="col" id="col-7">col-7</div>
        <div class="col" id="col-8">col-8</div>
        <div class="col" id="col-9">col-9</div>
    </div>
</body>
</html>
