<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .relative{
            padding: 50px 0px;
            background-color: aqua;
            position: relative;
            top:50px;
            height: 400px;
        }
        .absolute{
            height: 50px;
            width: 50px;
            background-color: black;
            position: absolute;
            right: 0;
            top:0;
        }
        .nav{
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px 0px;
            position: sticky;
            top:0;
            z-index: 1;
        }
        .fixed-div{
            height: 200px;
            width: 200px;
            background-color: red;
            color: white;
            position: fixed;
            right:10px;
            top:200px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <h1>Welcome To App</h1>
    </div>
    <div class="relative">
        Relative position example
        <div class="absolute">

        </div>
    </div>
    <div class="relative">
        Relative position example
        <div class="absolute">

        </div>
    </div>
    <div class="relative">
        Relative position example
        <div class="absolute">

        </div>
    </div>
    <div class="relative">
        Relative position example
        <div class="absolute">

        </div>
    </div>
    <div class="relative">
        Relative position example
        <div class="absolute">

        </div>
    </div>
    <div class="fixed-div">
        fixed div example
    </div>
</body>
</html>
